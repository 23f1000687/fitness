<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Home Aesthetic Plan</title>
<style>
:root{--bg:#0b0d10;--card:#151920;--card2:#1d222b;--line:#272d38;--txt:#eef1f5;--mut:#8b94a3;--acc:#c6f432;--acc2:#ff8a3d;--ok:#3ddc97;--r:16px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;font-size:15px;line-height:1.45;padding-bottom:90px;max-width:560px;margin:0 auto}
button{font-family:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 16px 6px;border-bottom:1px solid #12151a}
.brand{display:flex;justify-content:space-between;align-items:center}
.brand h1{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);font-weight:800}
.brand h1 b{color:var(--acc)}
.pct{font-size:11px;color:var(--mut)}
.wk{display:flex;align-items:center;justify-content:space-between;margin-top:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px}
.wk button{width:46px;height:46px;border-radius:10px;border:0;background:var(--card2);color:var(--txt);font-size:20px}
.wk button:active{transform:scale(.94)}
.mid{text-align:center}
.mid .n{font-size:22px;font-weight:800;letter-spacing:-.02em}
.mid .ph{font-size:10.5px;text-transform:uppercase;letter-spacing:.14em;color:var(--acc);font-weight:700}
.bar{height:5px;background:var(--line);border-radius:5px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),#9be22d);transition:width .45s ease}
.days{display:flex;gap:6px;overflow-x:auto;padding:10px 16px 6px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.chip{flex:1 0 auto;min-width:48px;padding:8px 4px;border-radius:12px;background:var(--card);border:1px solid var(--line);color:var(--mut);text-align:center;font-size:12.5px;font-weight:700;position:relative}
.chip small{display:block;font-size:10px;font-weight:500;opacity:.85;margin-top:1px}
.chip.on{background:var(--acc);color:#10140a;border-color:var(--acc)}
.chip.done::after{content:"✓";position:absolute;top:-6px;right:-4px;background:var(--ok);color:#06140d;width:18px;height:18px;border-radius:50%;font-size:11px;font-weight:900;display:grid;place-items:center}
main{padding:8px 16px}
.dayhead{background:radial-gradient(120% 140% at 100% 0%,rgba(198,244,50,.16),transparent 60%),var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:10px}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--mut);font-weight:700}
.dayhead h2{font-size:28px;font-weight:900;letter-spacing:-.03em;margin-top:2px}
.sub{color:#c3cad4;font-size:13.5px}
.meta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mut);margin-top:10px}
.note{background:rgba(255,138,61,.1);border:1px solid rgba(255,138,61,.35);color:#ffc9a6;border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:8px}
.note b{color:var(--acc2)}
.item{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px;transition:opacity .25s,border-color .25s}
.item.chk{opacity:.55;border-color:rgba(198,244,50,.35)}
.item.chk .t{text-decoration:line-through;text-decoration-color:var(--acc)}
.box{flex:0 0 32px;height:32px;border-radius:10px;border:2px solid #3a4250;background:transparent;display:grid;place-items:center;font-weight:900;color:#10140a;font-size:16px;transition:.2s}
.item.chk .box{background:var(--acc);border-color:var(--acc);transform:scale(1.05)}
.body{flex:1;min-width:0}
.tap{cursor:pointer}
.t{font-weight:750;font-size:15.5px}
.rx{color:var(--acc);font-weight:700;font-size:13.5px;margin-top:1px}
.tm{font-size:11px;color:var(--acc2);font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.d{font-size:13px;color:#c3cad4;margin-top:2px}
.pp{font-size:11.5px;color:var(--mut);margin-top:3px}
details summary{color:var(--mut);font-size:12px;margin-top:5px;cursor:pointer;list-style:none;display:inline-block;padding:3px 0}
details summary::-webkit-details-marker{display:none}
details[open] summary{color:var(--acc)}
details p{font-size:13px;color:#cfd5de;margin-top:4px;background:var(--card2);border-radius:10px;padding:10px}
.win{text-align:center;padding:16px;border-radius:14px;background:rgba(61,220,151,.12);border:1px solid rgba(61,220,151,.4);color:#aef3d2;font-weight:700;margin:6px 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
.card h3{font-size:16px;font-weight:800;margin-bottom:8px}
.card h3 .tag{font-size:10px;background:var(--acc);color:#10140a;padding:2px 7px;border-radius:20px;margin-left:6px;vertical-align:middle;letter-spacing:.06em}
.card p,.card li{font-size:13.5px;color:#cfd5de}
.card ul{padding-left:18px}
.card li{margin-bottom:6px}
.card b{color:var(--txt)}
.sec{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--mut);font-weight:800;margin:16px 2px 8px}
.prot{display:flex;justify-content:space-between;align-items:baseline}
.prot .big{font-size:30px;font-weight:900;letter-spacing:-.03em}
.prot .big span{font-size:14px;color:var(--mut);font-weight:600}
.tbl{overflow-x:auto;border-radius:14px;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;min-width:430px;background:var(--card)}
th,td{padding:7px 6px;text-align:center;font-size:12px;border-bottom:1px solid var(--line)}
th{color:var(--mut);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.05em;background:var(--card2)}
td:first-child{font-weight:800;color:var(--txt)}
tr.test td:first-child{color:var(--acc)}
tr.test{background:rgba(198,244,50,.05)}
td input{width:62px;background:var(--bg);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:7px 4px;text-align:center;font-size:14px}
td input:focus{outline:none;border-color:var(--acc)}
.sumgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.sg{background:var(--card2);border-radius:12px;padding:10px}
.sg .k{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.sg .v{font-size:19px;font-weight:850}
.sg .dl{font-size:12px;font-weight:700}
.up{color:var(--ok)}.down{color:#ff6b6b}.nt{color:var(--mut)}
.road{border-left:3px solid var(--line);padding-left:12px;margin-left:4px}
.road .st{position:relative;margin-bottom:14px}
.road .st::before{content:"";position:absolute;left:-19px;top:4px;width:11px;height:11px;border-radius:50%;background:var(--line);border:2px solid var(--bg)}
.road .st.now::before{background:var(--acc)}
.road h4{font-size:14.5px;font-weight:800}
.road h4 small{color:var(--acc);font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase;display:block}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:rgba(11,13,16,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom));z-index:9}
nav .in{display:flex;gap:6px;width:100%;max-width:540px}
nav button{flex:1;background:transparent;border:0;color:var(--mut);padding:8px 2px;border-radius:12px;font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button .ic{font-size:19px;line-height:1}
nav button.on{color:var(--acc);background:rgba(198,244,50,.09)}
.reset{background:transparent;border:1px solid var(--line);color:var(--mut);padding:10px;border-radius:12px;width:100%;font-size:12.5px;margin-top:6px}
</style>
</head>
<body>
<header>
  <div class="brand"><h1>Home <b>Aesthetic</b> Plan</h1><span class="pct" id="pct"></span></div>
  <div class="wk">
    <button data-a="wkm" aria-label="previous week">‹</button>
    <div class="mid"><div class="n" id="wkn"></div><div class="ph" id="wkp"></div></div>
    <button data-a="wkp" aria-label="next week">›</button>
  </div>
  <div class="bar"><i id="wkbar" style="width:0"></i></div>
</header>
<div class="days" id="chips"></div>
<main id="main"></main>
<nav><div class="in">
  <button data-a="tab" data-v="train"><span class="ic">🏋️</span>Train</button>
  <button data-a="tab" data-v="eat"><span class="ic">🍛</span>Eat</button>
  <button data-a="tab" data-v="prog"><span class="ic">📈</span>Progress</button>
  <button data-a="tab" data-v="guide"><span class="ic">📘</span>Rules</button>
</div></nav>

<script>
const PH={1:{name:"Foundation"},2:{name:"Build"},3:{name:"Push Harder"}};
const phaseOf=w=>w<=4?1:w<=8?2:3;

const EX={
warm:{n:"Warm-up (4 min)",how:"20 arm circles each direction → 15 band pull-aparts (arms straight, pull band to chest) → 10 bodyweight squats → 10 scapula push-ups (arms locked, only move the shoulder blades). Never skip it — cold shoulders get injured."},
pu:{n:"Push-ups",how:"Hands slightly wider than shoulders. Body in one straight line — squeeze glutes and abs. Lower for 2 seconds until chest is a fist away from the floor. Elbows at ~45°, not flared out like a T. Push up hard. If form breaks, the set is over."},
dec:{n:"Decline push-ups",how:"Same as a push-up but with feet up on the bed or a chair. Hits the UPPER chest — the part that makes a chest look full in a T-shirt. Don't let the hips sag."},
bpu:{n:"Band-resisted push-ups",how:"Loop a band across your upper back, hold one end under each palm, then do push-ups. The band makes the top of each rep harder. Too easy? Thicker band. Too hard? Go back to decline push-ups."},
arch:{n:"Archer push-ups",how:"Hands very wide. Lower toward ONE hand while the other arm stays almost straight and slides out. Push back up. This is the bridge to one-arm strength. Use a smaller range at first if needed."},
pike:{n:"Pike push-ups",how:"Make an upside-down V: hips high, legs fairly straight. Bend elbows and lower your head toward the floor just in front of your hands, elbows pointing back, not out. This is your overhead press — it builds the front and top of the shoulders."},
fpike:{n:"Feet-elevated pike push-ups",how:"Pike push-up with feet on the bed so your body is more vertical — more load on the shoulders. Your head and hands form a triangle at the bottom."},
lat:{n:"Band lateral raises",how:"Stand on the middle of the band, one handle in each hand. Slight bend in the elbows. Raise arms out to the SIDES to shoulder height, leading with the elbows. 2 seconds down. No swinging. This is the #1 exercise for wide, capped shoulders — take it seriously."},
dip:{n:"Chair / bed dips",how:"Hands on the edge of a sturdy chair or bed behind you, fingers forward. Lower until upper arms are about parallel to the floor, shoulders down away from the ears, then push up. Don't go deeper than that — it strains the shoulders."},
ohe:{n:"Band overhead triceps extension",how:"Hook one end of the band under your foot, hold the other end behind your head with both hands. Elbows point to the ceiling and stay close to your head. Straighten your arms overhead, lower slowly. This hits the long head — the biggest part of the triceps."},
dia:{n:"Diamond push-ups",how:"Hands together under your chest, thumbs and index fingers forming a diamond. Elbows stay close to the body. Pure triceps. Drop to your knees when full reps fail."},
pull:{n:"Pull-ups",how:"Overhand grip, slightly wider than shoulders. Start from a dead hang with straight arms. Pull shoulder blades down first, then drive elbows toward your ribs until the chin clears the bar. Lower in 2–3 seconds. No kicking, no swinging. Several clean sets of a few reps beats one ugly max set."},
chin:{n:"Chin-ups",how:"Underhand grip, shoulder-width. Same rules as pull-ups — more biceps. Lower slowly; the lowering part builds the most muscle."},
row:{n:"Band rows",how:"Door anchor at chest height, door closed. Step back until the band is tight. Pull handles to your lower ribs, elbows close to the body, squeeze shoulder blades together for 1 second. Builds back thickness."},
face:{n:"Band face pulls",how:"Anchor at face height. Pull the band toward your forehead with elbows high and hands spreading apart — finish like a double-bicep pose. Fixes rounded shoulders and builds the rear delts that make shoulders look 3D from the side."},
curl:{n:"Band biceps curls",how:"Stand on the band, palms forward, elbows pinned to your sides. Curl up, squeeze 1 second, lower in 2 seconds. If your body rocks, the band is too heavy."},
hkr:{n:"Hanging knee raises",how:"Hang from the bar. Bring knees to chest by curling your pelvis UP — don't just lift the legs. Lower with control, no swinging. Your best lower-ab exercise."},
hlr:{n:"Hanging leg raises",how:"Hang from the bar. Raise legs as straight as you can to hip height or higher, curling the pelvis up at the top. Lower in 2 seconds. Bend knees slightly if needed and straighten them over the weeks."},
skip:{n:"Skipping rope",how:"Rope length: stand on the middle — handles should reach your armpits. Jump only 1–2 inches, land on the balls of your feet, elbows close, turn the rope with your WRISTS not your arms. Tripping is normal — just restart. Wear shoes and avoid bare concrete. If the rope is too frustrating in week 1, do the jumping motion without it."},
sq:{n:"Bodyweight squats",how:"Feet shoulder-width, toes slightly out. Sit back and down over 3 seconds, chest up, knees follow the toes. Go at least until thighs are parallel to the floor. Stand up driving through the whole foot."},
bsq:{n:"Band squats",how:"Stand on the band with both feet, handles at your shoulders. Squat exactly like a bodyweight squat. Add a second band when 15 reps feel easy."},
lunge:{n:"Reverse lunges",how:"Stand tall, step one foot BACK, lower until the back knee nearly touches the floor, front shin roughly vertical. Push through the front heel to stand."},
bss:{n:"Bulgarian split squats",how:"Rear foot on the bed or a chair behind you, front foot about 2 feet forward. Lower straight down until the back knee nearly touches the floor. Lean slightly forward for more glutes, stay upright for more quads. Hold band handles for extra load later. The best leg builder you have at home — it will burn."},
rdl:{n:"Band Romanian deadlifts",how:"Stand on the band, handles in hands. Soft knees, back FLAT. Push your hips backward until you feel a strong stretch in the hamstrings, then drive the hips forward and squeeze the glutes at the top. Never round the lower back."},
bridge:{n:"Glute bridges",how:"Lie on your back, knees bent, feet flat near your butt. Push through the heels, lift hips until your body is straight from knees to shoulders, squeeze glutes hard for 2 seconds. Don't arch the lower back to get higher."},
slb:{n:"Single-leg glute bridges",how:"Same as a glute bridge with one foot in the air. Keep the hips level. Much harder — builds the glutes and fixes left/right imbalance."},
thrust:{n:"Hip thrusts (back on bed)",how:"Upper back on the edge of the bed, feet flat. Drive hips up until your body is flat like a table, squeeze the glutes 2 seconds. Do it single-leg, or both legs with a band across the hips held down by your hands."},
calf:{n:"Calf raises (stair edge)",how:"Balls of the feet on a stair edge, hand on a wall. Drop the heels for a full stretch, pause, rise all the way onto the toes, pause 1 second. Slow reps — calves only grow with full range."},
slc:{n:"Single-leg calf raises",how:"Calf raise on the stair edge on ONE foot, the other tucked behind. Full stretch at the bottom, full squeeze at the top."},
core1:{n:"Core: Plank + Dead bug",how:"PLANK: forearms under shoulders, body straight, squeeze glutes and abs, tuck the pelvis slightly — no sagging hips. DEAD BUG: lie on your back, arms up, knees bent at 90°. Press the lower back INTO the floor, then slowly extend the opposite arm and leg. This directly fixes the belly pushing forward."},
core2:{n:"Core: Plank + Dead bug + Side plank",how:"PLANK and DEAD BUG as before. SIDE PLANK: on one forearm, body straight sideways, hips high — tightens the waist and sides."},
core3:{n:"Core: Hollow hold + Plank + Side plank",how:"HOLLOW HOLD: lie on your back, press the lower back into the floor, lift shoulders and legs a few inches, arms overhead. If the back lifts, bend the knees. Then PLANK and SIDE PLANK. This is the gymnast core that makes abs look sharp."}
};

const PLAN={
push:{
1:[["warm",""],["pu","4 × 12 · rest 60s"],["lat","3 × 15 · light band"],["pike","3 × 8"],["dip","3 × 10 · knees bent"],["ohe","3 × 12"],["dia","1 × max · finisher"]],
2:[["warm",""],["dec","4 × 10–12 · rest 60s"],["lat","4 × 15"],["fpike","3 × 8"],["dip","3 × 12 · legs straight"],["ohe","3 × 15"],["dia","2 × max · finisher"]],
3:[["warm",""],["bpu","4 × 10–12 · rest 75s"],["arch","3 × 5 each side"],["fpike","4 × 8–10 · 3s down"],["lat","4 × 15–20 · last set to failure"],["dip","3 × 15 · 3s down"],["ohe","3 × 15 · superset with dips"]]},
pull:{
1:[["warm",""],["pull","5 × 3 · rest 90s · perfect reps"],["chin","3 × 3–4"],["row","3 × 15"],["face","3 × 15"],["curl","3 × 12"],["hkr","3 × 8–10"]],
2:[["warm",""],["pull","5 × 4–5 · rest 90s · +1 slow 5s negative on last set"],["chin","3 × 5"],["row","4 × 12 · heavier band"],["face","3 × 15"],["curl","3 × 12"],["hkr","3 × 12–15"]],
3:[["warm",""],["pull","5 × 6 · wider grip"],["chin","4 × 5–6 · 3s down"],["row","4 × 12"],["face","3 × 20"],["curl","3 × 12 + drop set on the last"],["hlr","3 × 8–12"]]},
legs:{
1:[["warm",""],["skip","8 rounds: 20s jump / 40s rest"],["sq","4 × 15 · 3s down"],["lunge","3 × 10 each leg"],["rdl","3 × 12"],["bridge","3 × 15 · 2s squeeze"],["calf","3 × 15"],["core1","Plank 3 × 30s + Dead bug 2 × 8/side"]],
2:[["warm",""],["skip","10 rounds: 30s jump / 30s rest"],["bsq","4 × 15"],["bss","3 × 8–10 each leg"],["rdl","3 × 15 · heavier band"],["slb","3 × 10 each leg"],["slc","3 × 12 each leg"],["core2","Plank 3 × 45s + Dead bug 3 × 10/side + Side plank 2 × 25s/side"]],
3:[["warm",""],["skip","5 min non-stop (or 12 × 30s/30s)"],["bsq","4 × 15 · 2s pause at bottom"],["bss","3 × 12 each leg · 3s down"],["rdl","4 × 12"],["thrust","3 × 12 each leg (or 3 × 20 both)"],["slc","3 × 15 each leg"],["core3","Hollow 3 × 25s + Plank 3 × 60s + Side plank 2 × 35s/side"]]}
};

const DAYS=[
{d:"Mon",f:"Monday",t:"push",l:"Push A",s:"Push"},
{d:"Tue",f:"Tuesday",t:"pull",l:"Pull A",s:"Pull"},
{d:"Wed",f:"Wednesday",t:"legs",l:"Legs + Core A",s:"Legs"},
{d:"Thu",f:"Thursday",t:"push",l:"Push B",s:"Push"},
{d:"Fri",f:"Friday",t:"pull",l:"Pull B",s:"Pull"},
{d:"Sat",f:"Saturday",t:"legs",l:"Legs + Core B",s:"Legs"},
{d:"Sun",f:"Sunday",t:"rest",l:"Rest + Measure",s:"Rest"}];
const FOCUS={push:"Chest · Shoulders · Triceps",pull:"Back · Biceps · Rear delts · Lower abs",legs:"Thighs · Glutes · Hamstrings · Calves · Core · Cardio",rest:"Recover, walk, measure, plan the week"};
const TIME={push:"~25 min",pull:"~25 min",legs:"~30 min",rest:"~45 min walk"};

function restItems(w){
 const a=[{n:"30–45 min easy walk",rx:"Recovery + fat burn",how:""},
 {n:"Weigh yourself",rx:"Morning, after toilet, before eating",how:""},
 {n:"Measure waist at the navel",rx:"Relaxed, don't suck in — this number matters most",how:""},
 {n:"Enter numbers in the Progress tab",rx:"",how:""}];
 if([1,4,8,12].includes(w))a.push({n:"Progress photos",rx:"Front, side, back — same spot, same light, same time",how:""});
 a.push({n:"Stock up for next week",rx:"Soya chunks, chana, peanuts, moong",how:""});
 return a;
}
function dayItems(w,i){
 const t=DAYS[i].t;
 if(t==="rest")return restItems(w);
 return PLAN[t][phaseOf(w)].map(([k,rx])=>({n:EX[k].n,rx,how:EX[k].how}));
}
function weekNotes(w,i){
 const n=[],t=DAYS[i].t;
 if(w===1&&t!=="rest")n.push("<b>Week 1 rule:</b> do ONE set less than written on every exercise. Soreness is normal and fades by week 2.");
 if([1,6,12].includes(w)){
  if(i===0)n.push("<b>Test day:</b> before the workout, do ONE max set of push-ups (perfect form). Rest 3 min, then train. Log it.");
  if(i===1)n.push("<b>Test day:</b> before the workout, do ONE max set of pull-ups (dead hang, chin over bar). Rest 3 min, then train. Log it.");
  if(i===2)n.push("<b>Test day:</b> after the warm-up, skip non-stop as long as you can. Log the seconds.");
 }
 if((w===5||w===9)&&i===0)n.push("<b>New phase:</b> exercises have changed. Open \"How to do it\" on each one before starting.");
 if(i>=3&&i<=5)n.push("<b>Day B:</b> same as Day A. Beat Day A by at least 1 rep on 1 exercise.");
 if(w===12&&i===6)n.push("<b>Week 12 done.</b> Compare your Progress numbers with Week 1, then come back for the Phase 2 plan (Weeks 13–24).");
 return n;
}

const DIN={
soya:"2–3 chapatis + soya chunks (50 g dry) in sabzi or masala bhurji + green sabzi. Boil chunks 5 min and squeeze out the water first.",
bean:"2–3 chapatis + 1 katori soybean curry (~40 g dry soybeans: soak overnight, pressure cook 5–6 whistles) + sabzi.",
flex:"2–3 chapatis + whatever protein is at home: paneer (if affordable), rajma, chole, or soya chunks again + dahi."};
const DINROT=["soya","bean","soya","bean","soya","flex","soya"];
function meals(i){
 return [
 {tm:"7–9 AM",n:"Banana power shake",d:"300 ml milk + 1 banana + small handful peanuts (~25 g), blended. Later: swap the peanuts for 1 tbsp unsweetened peanut butter.",p:18},
 {tm:"1 PM",n:"Lunch",d:"3 chapatis (not 4) + 1 full katori THICK dal + sabzi + 1 bowl dahi (~200 g) + onion/cucumber salad.",p:25},
 {tm:"5 PM",n:"Pre-workout snack",d:"2 handfuls roasted chana (~40 g) OR 1 bowl moong sprouts chaat. Chai is fine — max 1 tsp sugar.",p:9},
 {tm:"9 PM",n:"Dinner",d:DIN[DINROT[i]],p:DINROT[i]==="flex"?25:30},
 {tm:"10:30 PM",n:"Optional: glass of milk",d:"250 ml if hungry or if you skipped the dahi. No sugar.",p:8}];
}
const HABITS=["3 litres of water","7,000+ steps (walk after lunch or dinner)","7–8 hours of sleep","Zero junk: no namkeen, biscuits, sweets, cold drinks, fried snacks"];

const S={week:1,day:(new Date().getDay()+6)%7,tab:"train",checks:{},logs:{}};
const key=(w,i,t,x)=>`w${w}-d${i}-${t}${x}`;
const $=id=>document.getElementById(id);

function dayDone(w,i){const it=dayItems(w,i);return it.length>0&&it.every((_,x)=>S.checks[key(w,i,"x",x)])}
function weekCounts(w){let d=0,t=0;for(let i=0;i<7;i++){const it=dayItems(w,i);t+=it.length;it.forEach((_,x)=>{if(S.checks[key(w,i,"x",x)])d++})}return[d,t]}
function weekPct(w){const[d,t]=weekCounts(w);return t?Math.round(d/t*100):0}
function overallPct(){let d=0,t=0;for(let w=1;w<=12;w++){const[a,b]=weekCounts(w);d+=a;t+=b}return t?Math.round(d/t*100):0}

function itemHTML(it,k,extra){
 const c=!!S.checks[k];
 return `<div class="item ${c?"chk":""}"><button class="box" data-a="tog" data-k="${k}" aria-label="mark done">${c?"✓":""}</button><div class="body"><div class="tap" data-a="tog" data-k="${k}">${extra&&extra.tm?`<div class="tm">${extra.tm}</div>`:""}<div class="t">${it.n}</div>${it.rx?`<div class="rx">${it.rx}</div>`:""}${extra&&extra.d?`<div class="d">${extra.d}</div>`:""}${extra&&extra.p?`<div class="pp">≈ ${extra.p} g protein</div>`:""}</div>${it.how?`<details><summary>How to do it ▾</summary><p>${it.how}</p></details>`:""}</div></div>`;
}

function trainView(){
 const w=S.week,i=S.day,d=DAYS[i],items=dayItems(w,i);
 const done=items.filter((_,x)=>S.checks[key(w,i,"x",x)]).length;
 return `<div class="dayhead"><div class="lbl">${d.f} · Week ${w}</div><h2>${d.l}</h2><div class="sub">${FOCUS[d.t]}</div><div class="meta"><span>⏱ ${TIME[d.t]}</span><span>${done}/${items.length} done</span></div><div class="bar"><i style="width:${items.length?done/items.length*100:0}%"></i></div></div>
 ${weekNotes(w,i).map(n=>`<div class="note">${n}</div>`).join("")}
 ${items.map((it,x)=>itemHTML(it,key(w,i,"x",x))).join("")}
 ${done===items.length&&items.length?`<div class="win">🔥 ${d.t==="rest"?"Week wrapped up. Ready for the next one.":"Day complete. Now eat your protein."}</div>`:""}
 ${d.t!=="rest"?`<div class="card"><p><b>Tempo:</b> 2 seconds down, 1 second up, unless written otherwise. <b>Rest:</b> 60–90s between sets. <b>Stop</b> 1–2 reps before failure on most sets — ugly reps don't count.</p></div>`:""}`;
}

function eatView(){
 const w=S.week,i=S.day,m=meals(i);
 let p=0;m.forEach((x,j)=>{if(S.checks[key(w,i,"m",j)])p+=x.p});
 const hd=HABITS.filter((_,j)=>S.checks[key(w,i,"h",j)]).length;
 return `<div class="dayhead"><div class="lbl">${DAYS[i].f} · Week ${w}</div><div class="prot"><div class="big">${p}<span> / ~100 g protein</span></div><div class="lbl">${hd}/${HABITS.length} habits</div></div><div class="bar"><i style="width:${Math.min(100,p)}%"></i></div></div>
 <div class="sec">Meals — tick when eaten</div>
 ${m.map((x,j)=>itemHTML({n:x.n,rx:"",how:""},key(w,i,"m",j),x)).join("")}
 <div class="sec">Daily habits</div>
 ${HABITS.map((h,j)=>itemHTML({n:h,rx:"",how:""},key(w,i,"h",j))).join("")}
 <div class="sec">Food rules — no negotiation</div>
 <div class="card"><ul>
 <li><b>Chapatis: ~8/day → 5–6/day.</b> This is the main lever for your belly. Not the ab exercises.</li>
 <li><b>Oil/ghee:</b> about 1 tsp per serving. Sabzi swimming in oil = hidden calories.</li>
 <li><b>Sugar:</b> max 1 tsp in chai. No sweets on weekdays.</li>
 <li><b>One relaxed meal per week</b> — one meal, not a full cheat day.</li>
 <li><b>Waist not dropping for 3 weeks?</b> Remove 1 more chapati at dinner.</li>
 <li><b>Weak or dizzy during workouts?</b> Eat the chana snack closer to 5:30, or add a banana.</li>
 <li><b>Soy is safe.</b> The "soy = female hormones" claim isn't supported at normal food amounts like this.</li>
 </ul></div>`;
}

function fmt(v){return v===undefined||v===""?"—":v}
function summaryHTML(){
 const F=[["wt","Weight","kg",-1],["waist","Waist","cm",-1],["push","Push-ups","",1],["pull","Pull-ups","",1]];
 return F.map(([f,lab,u,good])=>{
  const vals=[];for(let w=1;w<=12;w++){const v=S.logs[w]&&S.logs[w][f];if(v!==undefined&&v!=="")vals.push(parseFloat(v))}
  if(!vals.length)return `<div class="sg"><div class="k">${lab}</div><div class="v nt">—</div><div class="dl nt">no data yet</div></div>`;
  const a=vals[0],b=vals[vals.length-1],dl=+(b-a).toFixed(1);
  const cls=dl===0?"nt":(dl*good>0?"up":"down");
  return `<div class="sg"><div class="k">${lab}</div><div class="v">${b}${u?" "+u:""}</div><div class="dl ${cls}">${dl>0?"+":""}${dl}${u?" "+u:""} since start</div></div>`;
 }).join("");
}
function progView(){
 const F=[["wt","Wt kg"],["waist","Waist cm"],["push","Push-ups"],["pull","Pull-ups"],["skip","Skip sec"]];
 let rows="";
 for(let w=1;w<=12;w++){
  const test=[1,6,12].includes(w);
  rows+=`<tr class="${test?"test":""}"><td>W${w}${test?" ★":""}</td>${F.map(([f])=>`<td><input inputmode="decimal" type="number" step="0.1" data-log="${w}-${f}" value="${(S.logs[w]&&S.logs[w][f])||""}"></td>`).join("")}</tr>`;
 }
 return `<div class="dayhead"><div class="lbl">Overall</div><h2>${overallPct()}% done</h2><div class="sub">Workouts ticked across all 12 weeks</div><div class="bar"><i style="width:${overallPct()}%"></i></div></div>
 <div class="sec">Change since your first entry</div>
 <div class="sumgrid" id="sum">${summaryHTML()}</div>
 <div class="sec">Weekly log · Sunday mornings</div>
 <div class="tbl"><table><tr><th>Wk</th>${F.map(([,l])=>`<th>${l}</th>`).join("")}</tr>${rows}</table></div>
 <p style="font-size:12px;color:var(--mut);margin:8px 2px">★ = test weeks: log max push-ups, pull-ups and skipping. Other weeks: weight and waist are enough.</p>
 <div class="sec">Honest week-12 targets</div>
 <div class="card"><ul>
 <li><b>Waist:</b> −3 to −6 cm. This is the real fat-loss number.</li>
 <li><b>Weight:</b> may barely move (±2 kg). That's fine — fat out, muscle in.</li>
 <li><b>Push-ups:</b> 30–35 clean. <b>Pull-ups:</b> 8–10 clean.</li>
 <li><b>Skipping:</b> 3–5 minutes non-stop.</li>
 <li><b>Mirror:</b> flatter lower belly, visible shoulder shape, wider-looking back. Clear abs usually need months 5–6.</li>
 </ul></div>
 <button class="reset" data-a="reset">Reset all ticks & logs</button>`;
}

function guideView(){
 const ph=phaseOf(S.week);
 return `<div class="sec">The 7 non-negotiables</div>
 <div class="card"><ul>
 <li><b>6 PM is fixed.</b> Treat it like a class you can't miss.</li>
 <li><b>Progressive overload:</b> when you hit the top of the rep range on every set with clean form, make it harder next session — harder variation, thicker band, stacked bands, or slower tempo.</li>
 <li><b>Form over reps.</b> Stop most sets 1–2 reps short of failure.</li>
 <li><b>Missed a day?</b> Don't double up. Continue with the next day.</li>
 <li><b>~100 g protein daily.</b> Training without it is wasted work.</li>
 <li><b>7,000+ steps daily.</b> The silent fat burner.</li>
 <li><b>7–8 hours of sleep.</b> Muscle is built while you sleep, not while you train.</li>
 </ul></div>
 <div class="sec">Bands</div>
 <div class="card"><p>Colors usually go light → heavy (check the labels on your set). You can clip <b>two bands onto the same handle</b> for more resistance. Use the door anchor for rows and face pulls, closing the door on the hinge side facing away from you. Check the bands for cracks every few weeks.</p></div>
 <div class="sec">The road to your physique</div>
 <div class="card"><div class="road">
 <div class="st now"><h4><small>Weeks 1–12 · this app${ph?"":""}</small>Foundation → Build → Push Harder</h4><p>Fat off the belly, habit locked, form perfect. Push-ups 30–35, pull-ups 8–10, waist −3 to −6 cm.</p></div>
 <div class="st"><h4><small>Weeks 13–24</small>Build + first calisthenics skills</h4><p>Pseudo-planche push-ups, wall handstand holds, archer pull-up negatives, tuck L-sit, box pistol squats, backpack-weighted push-ups and dips. Targets: 12–15 pull-ups, 40+ push-ups, upper abs visible in good light.</p></div>
 <div class="st"><h4><small>Weeks 25–48</small>Advanced calisthenics</h4><p>Muscle-up progression, wall handstand push-ups, archer pull-ups, full L-sit, dragon flag negatives, pistol squats, weighted pull-ups (backpack). The lean, V-tapered, visible-abs look. Then decide on the gym.</p></div>
 </div><p style="margin-top:4px"><b>At week 12,</b> come back with your Progress numbers. Phase 2 gets built around them.</p></div>
 <div class="sec">Honest timeline</div>
 <div class="card"><ul>
 <li><b>Week 2–4:</b> stronger, less bloated, better sleep. Mirror changes are small — don't quit here. This is where most people quit.</li>
 <li><b>Week 8–12:</b> waist visibly smaller, shoulders start to show, clothes fit differently.</li>
 <li><b>Month 5–6:</b> upper abs, athletic chest and back — only if the diet is followed.</li>
 <li><b>Month 9–12:</b> the aesthetic look you described.</li>
 </ul></div>`;
}

function render(){
 const w=S.week,ph=phaseOf(w);
 $("wkn").textContent=`Week ${w} / 12`;
 $("wkp").textContent=`Phase ${ph} · ${PH[ph].name}`;
 $("wkbar").style.width=weekPct(w)+"%";
 $("pct").textContent=`${overallPct()}% of 12 weeks`;
 const chips=$("chips");
 chips.style.display=(S.tab==="train"||S.tab==="eat")?"flex":"none";
 chips.innerHTML=DAYS.map((d,i)=>`<button class="chip ${i===S.day?"on":""} ${S.tab==="train"&&dayDone(w,i)?"done":""}" data-a="day" data-v="${i}">${d.d}<small>${d.s}</small></button>`).join("");
 document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===S.tab));
 $("main").innerHTML=S.tab==="train"?trainView():S.tab==="eat"?eatView():S.tab==="prog"?progView():guideView();
}

let saveTimer;
const hasStore=()=>typeof window!=="undefined"&&window.storage&&typeof window.storage.set==="function";
function save(){
 clearTimeout(saveTimer);
 saveTimer=setTimeout(async()=>{
  if(!hasStore())return;
  try{await window.storage.set("aesthetic-plan-v1",JSON.stringify({week:S.week,checks:S.checks,logs:S.logs}),false)}catch(e){console.error("save failed",e)}
 },300);
}
async function load(){
 if(hasStore()){
  try{const r=await window.storage.get("aesthetic-plan-v1",false);if(r&&r.value){const d=JSON.parse(r.value);if(d.week)S.week=d.week;S.checks=d.checks||{};S.logs=d.logs||{}}}catch(e){/* first run: nothing saved yet */}
 }
 render();
}

document.addEventListener("click",e=>{
 const el=e.target.closest("[data-a]");if(!el)return;
 const a=el.dataset.a;
 if(a==="wkm"&&S.week>1){S.week--;save();render();window.scrollTo(0,0)}
 else if(a==="wkp"&&S.week<12){S.week++;save();render();window.scrollTo(0,0)}
 else if(a==="day"){S.day=+el.dataset.v;render();window.scrollTo(0,0)}
 else if(a==="tab"){S.tab=el.dataset.v;render();window.scrollTo(0,0)}
 else if(a==="tog"){const k=el.dataset.k;if(S.checks[k])delete S.checks[k];else S.checks[k]=true;save();const y=window.scrollY;render();window.scrollTo(0,y)}
 else if(a==="reset"){if(confirm("Delete ALL ticks and logged numbers?")){S.checks={};S.logs={};S.week=1;save();render()}}
});
document.addEventListener("change",e=>{
 const el=e.target;if(!el.dataset||!el.dataset.log)return;
 const[w,f]=el.dataset.log.split("-");
 S.logs[w]=S.logs[w]||{};S.logs[w][f]=el.value;save();
 const s=$("sum");if(s)s.innerHTML=summaryHTML();
});
render();load();
</script>
</body>
</html>
